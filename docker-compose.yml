version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_CONSUMER_TIMEOUT: 0
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: prod_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./src:/app/src

volumes:
  rabbitmq_data:
  postgres_data: